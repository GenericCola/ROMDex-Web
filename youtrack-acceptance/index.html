<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>ROMDex acceptance</title>
    <style>
      body {
        font: 14px system-ui;
        margin: 12px;
      }
      button {
        padding: 8px;
        margin: 4px;
      }
      pre {
        white-space: pre-wrap;
        overflow: auto;
        max-height: 250px;
      }
      #result {
        border: 1px solid;
        padding: 8px;
      }
    </style>
  </head>
  <body>
    <h3>ROMDex acceptance - synthetic issues only</h3>
    <p>
      Only NPCD-872 and NPCD-873 are allowed. Buttons update these fixtures. No
      token is stored. Production sharing stays off.
    </p>
    <button id="read">Read live metadata</button
    ><button id="run">Run assignment, rollup and concurrency checks</button
    ><button id="rollback">Run forced rollback check</button>
    <pre id="result" role="status">Registering widget...</pre>
    <script type="module" src="panel.js"></script>
  </body>
</html>
