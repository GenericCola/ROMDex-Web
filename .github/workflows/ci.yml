# All heavy checks run here, not on the shared VPS (owner, 2026-11-07).
# Browser tests use the Chromium-based Playwright projects only.
# Manual runs (Actions tab or `gh workflow run ci.yml --ref <branch> -f ...`) can run one spec,
# one project, or the performance measurement. GitHub only offers manual runs once this file
# is on the default branch.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
    inputs:
      spec:
        description: "Run only this e2e spec (path or name filter, e.g. task-port). Empty runs all."
        type: string
        default: ""
      project:
        description: "Playwright project"
        type: choice
        default: all
        options: [all, chromium, mobile-chromium]
      perf:
        description: "Run the performance measurement (tests/perf) instead of e2e"
        type: boolean
        default: false
      perf_base_ref:
        description: "Optional ref to measure as a baseline for comparison (e.g. main)"
        type: string
        default: ""

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"
  PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        target: [typecheck, "typecheck:tests", "typecheck:server"]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm ${{ matrix.target }}

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target: [test, "test:server"]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm ${{ matrix.target }}

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: actions/upload-artifact@v7
        with:
          name: out
          path: out/
          retention-days: 3

  e2e:
    if: ${{ !inputs.perf }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, mobile-chromium]
        shard: [1, 2]
    steps:
      - name: Skip projects not selected
        id: pick
        run: |
          want="${{ inputs.project || 'all' }}"
          spec="${{ inputs.spec }}"
          run=true
          if [ "$want" != all ] && [ "$want" != "${{ matrix.project }}" ]; then run=false; fi
          # A single spec runs unsharded in shard 1 only.
          if [ -n "$spec" ] && [ "${{ matrix.shard }}" != 1 ]; then run=false; fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
      - if: steps.pick.outputs.run == 'true'
        uses: actions/checkout@v7
      - if: steps.pick.outputs.run == 'true'
        uses: pnpm/action-setup@v6
      - if: steps.pick.outputs.run == 'true'
        uses: actions/setup-node@v7
        with: { node-version: 24, cache: pnpm }
      - if: steps.pick.outputs.run == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.pick.outputs.run == 'true'
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - if: steps.pick.outputs.run == 'true'
        id: pw-cache
        uses: actions/cache@v6
        with:
          path: .playwright-browsers
          key: playwright-chromium-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - if: steps.pick.outputs.run == 'true' && steps.pw-cache.outputs.cache-hit != 'true'
        run: node scripts/playwright.mjs install --with-deps chromium
      - if: steps.pick.outputs.run == 'true' && steps.pw-cache.outputs.cache-hit == 'true'
        run: node scripts/playwright.mjs install-deps chromium
      - if: steps.pick.outputs.run == 'true'
        uses: actions/download-artifact@v8
        with: { name: out, path: out }
      - if: steps.pick.outputs.run == 'true'
        name: Browser tests (${{ matrix.project }}, shard ${{ matrix.shard }}/2)
        env:
          # Unique blob names so the merged report keeps both projects' shards.
          PLAYWRIGHT_BLOB_OUTPUT_NAME: report-${{ matrix.project }}-${{ matrix.shard }}.zip
        run: |
          if [ -n "${{ inputs.spec }}" ]; then
            pnpm test:e2e --project=${{ matrix.project }} "${{ inputs.spec }}"
          else
            pnpm test:e2e --project=${{ matrix.project }} --shard=${{ matrix.shard }}/2
          fi
      - if: ${{ !cancelled() && steps.pick.outputs.run == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: blob-report-${{ matrix.project }}-${{ matrix.shard }}
          path: blob-report/
          retention-days: 7
      - if: ${{ failure() && steps.pick.outputs.run == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: traces-${{ matrix.project }}-${{ matrix.shard }}
          path: test-results/
          retention-days: 7

  e2e-report:
    if: ${{ !cancelled() && !inputs.perf }}
    needs: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true
      - name: Merge into one HTML report
        run: node scripts/playwright.mjs merge-reports --reporter html ./all-blob-reports
      - uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  perf:
    if: ${{ inputs.perf }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: node scripts/playwright.mjs install --with-deps chromium
      - run: pnpm build
      - name: Baseline checkout
        if: ${{ inputs.perf_base_ref != '' }}
        run: |
          git fetch --no-tags origin "${{ inputs.perf_base_ref }}"
          git worktree add ../base FETCH_HEAD
          cd ../base && pnpm install --frozen-lockfile && pnpm build
          ln -s "$PLAYWRIGHT_BROWSERS_PATH" .playwright-browsers
      - name: Measure (3 paired runs)
        env:
          PERF_OUT: ${{ github.workspace }}/perf-results
        run: |
          for i in 1 2 3; do
            if [ -n "${{ inputs.perf_base_ref }}" ]; then node tests/perf/measure.mjs base-r$i ../base 3900; fi
            node tests/perf/measure.mjs head-r$i . 3900
          done
          {
            echo "## Performance (means of 3 runs)"
            if [ -n "${{ inputs.perf_base_ref }}" ]; then
              echo "Baseline \`${{ inputs.perf_base_ref }}\` → this ref"
              node tests/perf/table.mjs base head
            else
              node tests/perf/table.mjs head
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: perf-results
          path: perf-results/
          retention-days: 30
