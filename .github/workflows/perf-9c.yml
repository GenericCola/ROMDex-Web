# TEMPORARY (PMON-636): paired perf runs on push for this branch only, because the
# workflow_dispatch perf job in ci.yml can't be started until ci.yml is on main.
# Remove before the branch is merged.
name: Perf (temporary, 9c)

on:
  push:
    branches: ["feat/9c-virtual-table"]

concurrency:
  group: perf-9c-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"
  PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers

jobs:
  perf:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: node scripts/playwright.mjs install --with-deps chromium
      - run: pnpm build
      - name: Baseline checkout
        run: |
          git fetch --no-tags origin "feat/youtrack-storage"
          git worktree add ../base FETCH_HEAD
          cd ../base && pnpm install --frozen-lockfile && pnpm build
          ln -s "$PLAYWRIGHT_BROWSERS_PATH" .playwright-browsers
      - name: Measure (3 paired runs)
        env:
          PERF_OUT: ${{ github.workspace }}/perf-results
        run: |
          for i in 1 2 3; do
            if [ -n "feat/youtrack-storage" ]; then node tests/perf/measure.mjs base-r$i ../base 3900; fi
            node tests/perf/measure.mjs head-r$i . 3900
          done
          {
            echo "## Performance (means of 3 runs)"
            if [ -n "feat/youtrack-storage" ]; then
              echo "Baseline \`feat/youtrack-storage\` → this ref"
              node tests/perf/table.mjs base head
            else
              node tests/perf/table.mjs head
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: perf-results
          path: perf-results/
          retention-days: 30
